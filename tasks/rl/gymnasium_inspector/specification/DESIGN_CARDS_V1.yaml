      - verify
      - finish
    main_trap: "attempting a dependent milestone too early"
    failure_modes:
      - dependency_violation
      - wrong_order
    recovery: "return to the missing prerequisite"
    reward_focus:
      progress: true
      correctness: true
      terminal_success: true
    oracle: "complete prerequisites before dependent milestones."
    verifier: "validate dependency ordering and completed milestone set."
    hidden_evaluation: "vary dependency graph structure."

  GI-M05:
