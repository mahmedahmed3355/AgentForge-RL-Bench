schema_version: "1.0"
domain: "gymnasium_inspector"
task_count: 33

design_rules:
  implementation_order: "design_card_then_environment_then_oracle_then_verifier_then_tests"
  easy_allowed: false
  oracle_required: true
  verifier_required: true
  inspector_public_only: true
  hidden_evaluation_required: true
  deterministic_replay_required: true

tasks:

  GI-M01:
    difficulty: medium
    family: observation
    primary_capability: observation
    title: "Relevant State Signal"
    scenario: "The environment exposes several observation fields containing useful and irrelevant state information."
    objective: "Identify the observation signal required to determine the next valid action."
    initial_state: "episode starts with multiple public state fields and one decision-relevant field."
    stages:
      - observe
      - identify
      - act
      - verify
    inspector:
      enabled: true
      operations:
        - inspect_state
        - inspect_observation
    actions:
      - inspect
      - select
      - finish
    main_trap: "irrelevant observation fields"
    failure_modes:
      - invalid_selection
      - premature_finish
    recovery: "retry before terminal state"
    reward_focus:
      progress: true
      correctness: true
      terminal_success: true
      efficiency: true
    oracle: "select the decision-relevant signal and complete the valid action sequence."
    verifier: "validate final state, selected signal, and terminal condition."
    hidden_evaluation: "change irrelevant fields and decision-relevant values while preserving the underlying rule."

  GI-M02:
    difficulty: medium
    family: state_reasoning
    primary_capability: state_reasoning
    title: "Composite State Interpretation"
    scenario: "Current state must be inferred from several interacting public fields."
    objective: "Determine the logical state represented by the observation."
    initial_state: "multiple state indicators describe the same logical process."
    stages:
      - observe
      - interpret
      - act
      - verify
    inspector:
      enabled: true
      operations:
        - inspect_state
    actions:
      - inspect
      - classify_state
      - advance
      - finish
    main_trap: "single-field reasoning"
    failure_modes:
      - wrong_state
      - invalid_transition
    recovery: "reinspect and continue if not terminal"
    reward_focus:
      progress: true
      correctness: true
      terminal_success: true
    oracle: "combine the required state fields and choose the correct logical state."
    verifier: "validate logical state classification and final transition."
    hidden_evaluation: "vary field combinations without changing state semantics."

  GI-M03:
    difficulty: medium
    family: action_selection
    primary_capability: action_selection
    title: "State-Conditioned Action"
    scenario: "Several actions are available but only a subset satisfies current preconditions."
    objective: "Select and execute a valid action."
    initial_state: "environment exposes action candidates with state-dependent validity."
    stages:
      - inspect
      - evaluate
      - act
      - verify
    inspector:
      enabled: true
      operations:
        - inspect_state
        - inspect_actions
    actions:
      - inspect
      - execute_valid_action
      - finish
    main_trap: "action availability versus action validity"
    failure_modes:
      - invalid_action
      - wrong_precondition
    recovery: "choose another valid action"
    reward_focus:
      correctness: true
      efficiency: true
      terminal_success: true
    oracle: "select an action whose preconditions are satisfied."
    verifier: "validate action legality and resulting state."
    hidden_evaluation: "change which action is valid while preserving the rule."

  GI-M04:
    difficulty: medium
    family: dependency_tracking
    primary_capability: dependency_tracking
    title: "Milestone Dependencies"
    scenario: "Several milestones have prerequisite relationships."
    objective: "Complete all required milestones in dependency order."
    initial_state: "dependency graph is publicly inspectable."
    stages:
      - inspect
      - plan
      - execute
      - verify
    inspector:
      enabled: true
      operations:
