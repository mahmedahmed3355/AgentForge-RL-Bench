id: GI-H09
name: Composed Inspector Queries
difficulty: hard
family: inspector
primary_capability: tool_usage

objective: >
  Combine multiple legitimate Inspector operations to reconstruct
  the minimum sufficient public state information before acting.

inspector:
  enabled: true
  operations:
    - inspect_state
    - inspect_history
    - inspect_progress
    - inspect_diagnostics

actions:
  - inspect
  - correlate
  - act
  - finish

stages:
  - inspect
  - correlate
  - diagnose
  - act
  - verify

constraints:
  terminal_requires_valid_correlation: true
  public_information_only: true
  minimum_sufficient_queries: true
  trajectory_audit: true
  anti_cheat: true

reward:
  inspection: 0.5
  sufficient_correlation: 2.0
  correct_action: 2.5
  terminal_success: 5.0
  unnecessary_query_penalty: -0.5
  invalid_action_penalty: -2.0

hidden_evaluation:
  vary_information_distribution: true
  preserve_inspector_contract: true
