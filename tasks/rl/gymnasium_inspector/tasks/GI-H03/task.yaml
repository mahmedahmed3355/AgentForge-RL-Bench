task_id: GI-H03
version: "1.0.0"
domain: gymnasium_inspector
difficulty: hard
status: complete

name: Branching Irreversible Plan

objective: >
  Choose a globally valid branch under constrained resources, commit
  before irreversible execution, execute the selected plan, and finish
  with all state invariants satisfied.

agent_interface:
  type: gymnasium
  reset_returns: "observation, info"
  step_returns: "observation, reward, terminated, truncated, info"
  actions:
    inspect: 0
    commit: 1
    execute: 2
    finish: 3

environment:
  type: deterministic_gymnasium
  entrypoint: environment/data/gym_env.py
  class: BranchingIrreversibleEnv
  seedable: true
  horizon: 10
  irreversible_commitment: true

evaluation:
  success:
    terminated: true
    truncated: false
  failure:
    terminated: false
    truncated: true
  mutual_exclusion:
    terminated_and_truncated: false

oracle:
  deterministic: true
  entrypoint: oracle/solve.py
  strategy: select_globally_valid_branch_before_commit

reward:
  type: multi_reward
  components:
    planning: true
    correctness: true
    efficiency: true
    terminal_success: true
    penalties: true

verifier:
  hidden_boundary: true
  deterministic: true
  validates:
    - complete_trajectory
    - resource_constraints
    - irreversible_commitment
    - terminal_semantics
    - observation_space
    - action_space
    - reward_type
    - info_type

anti_cheat:
  enabled: true
  checks:
    - no_oracle_import
    - no_oracle_result_dependency
    - no_verifier_shortcut
    - trajectory_consistency

trajectory_audit:
  enabled: true
  require_history: true
