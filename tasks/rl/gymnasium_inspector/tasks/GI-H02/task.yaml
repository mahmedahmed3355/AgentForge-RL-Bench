task_id: GI-H02
version: "1.0.0"
name: "Interacting State Variables"
domain: gymnasium_inspector
difficulty: hard
objective: "Maintain causal consistency across multiple transitions."

agent_interface:
  type: gymnasium_environment
  reset: "(observation, info)"
  step: "(observation, reward, terminated, truncated, info)"

environment:
  path: environment/data/gym_env.py
  class: GymInspectorEnv
  observation_space: Dict
  action_space: Discrete

evaluation:
  deterministic_seed: true
  trajectory_audit: true
  hidden_boundary: true

reward:
  type: multi_reward
  components:
    - progress
    - correctness
    - terminal_success
    - penalties

oracle:
  path: oracle/solve.py
  deterministic: true

verifier:
  path: verifier/verify.py
  hidden_boundary: true

anti_cheat:
  enabled: true

status: complete
