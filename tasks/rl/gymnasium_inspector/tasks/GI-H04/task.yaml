name: GI-H04
objective: Complete all required nodes while respecting dependencies.
difficulty: hard
family: dependency_tracking
primary_capability: dependency_tracking

agent_interface:
  type: gymnasium
  action_space: discrete
  action_count: 6

environment:
  entrypoint: environment/data/gym_env.py
  class: DependencyGraphEnv
  max_steps: 8
  deterministic_seed: true

evaluation:
  success_condition: all_dependency_nodes_completed
  trajectory_required: true
  hidden_boundary: true
  anti_cheat: true

oracle:
  entrypoint: oracle/solve.py
  deterministic: true

reward:
  progress: true
  correctness: true
  terminal_success: true
  invalid_action_penalty: true

verifier:
  entrypoint: verifier/verify.py
  validates:
    - dependency_closure
    - trajectory
    - terminal_state
    - observation_validity

graph:
  nodes: [0, 1, 2, 3, 4, 5]
  dependencies:
    "0": []
    "1": []
    "2": [0]
    "3": [1]
    "4": [2, 3]
    "5": [4]
