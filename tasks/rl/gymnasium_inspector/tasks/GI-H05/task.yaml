name: GI-H05
title: Ambiguous Failure Diagnosis
difficulty: hard
family: diagnosis
primary_capability: diagnosis

objective: >
  Use discriminating evidence to identify the active root failure,
  recover correctly, and reach the terminal state.

agent_interface:
  type: gymnasium
  environment: environment.data.gym_env:AmbiguousFailureDiagnosisEnv
  actions:
    inspect: 0
    diagnose: 1
    recover: 2
    finish: 3

environment:
  deterministic: true
  seeded_reset: true
  max_steps: 8
  observation_space: MultiDiscrete
  action_space: Discrete

evaluation:
  success_requires:
    - correct_diagnosis
    - valid_recovery
    - terminal_completion
    - valid_observations
    - valid_rewards
    - valid_trajectory

oracle:
  deterministic: true
  sequence:
    - inspect
    - diagnose
    - recover
    - finish

reward:
  components:
    inspection: 0.5
    diagnosis: 2.5
    recovery: 2.5
    terminal_success: 4.0
    invalid_diagnosis: -1.0
    invalid_recovery: -1.5
    premature_finish: -1.0

verifier:
  checks:
    - root_cause
    - diagnostic_evidence
    - diagnosis
    - recovery
    - terminal_state
    - trajectory_order
    - observation_validity
    - reward_types

objective_constraints:
  root_failure: 2
  symptom: 1
  diagnostic_evidence: 7
