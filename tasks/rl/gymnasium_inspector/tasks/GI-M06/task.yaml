task_id: GI-M06
version: 1.0.0
domain: gymnasium_inspector
difficulty: medium
status: complete
name: Gymnasium Environment Contract Repair
objective: Repair the Gymnasium environment so that API outputs, observation and action spaces, termination semantics, deterministic seeding, and reward behavior satisfy the task contract.
agent_interface:
  type: terminal
  entrypoint: instruction.md
environment:
  type: gymnasium
  path: environment/data/gym_env.py
evaluation:
  type: hidden_verifier
  tests:
    - tests/test_gym_env.py
    - tests/test_outputs.py
    - tests/test_multi_reward.py
    - tests/test_hidden_boundary.py
    - tests/test_trajectory_audit.py
    - tests/test_anti_cheat.py
    - tests/test_oracle.py
reward:
  type: multi_reward
  components:
    - progress
    - terminal
oracle:
  deterministic: true
  path: oracle/solve.py
verifier:
  hidden_boundary: true
  path: verifier/verify.py
anti_cheat:
  required: true
  trajectory_audit: true
