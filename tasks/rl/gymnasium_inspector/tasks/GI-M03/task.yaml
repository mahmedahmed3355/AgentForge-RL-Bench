task_id: GI-M03
version: "1.0.0"
domain: gymnasium_inspector
difficulty: medium
status: complete
name: "Gymnasium observation and action space consistency"
objective: "Repair an environment whose declared Gymnasium spaces must accurately describe runtime observations and accepted actions."
agent_interface:
  type: gymnasium
  reset: "observation, info"
  step: "observation, reward, terminated, truncated, info"
environment:
  entrypoint: "environment/data/gym_env.py"
  class: "GymInspectorEnv"
  deterministic: true
  api: "gymnasium>=1.0"
evaluation:
  mode: "behavioral"
  deterministic: true
  hidden: true
  trajectory_audit: true
reward:
  type: "multi_reward"
  components:
    idle_penalty: "negative reward for no progress"
    progress: "positive reward for advancing state"
    terminal_bonus: "additional reward for reaching the target"
oracle:
  entrypoint: "oracle/solve.py"
  deterministic: true
  protected: true
verifier:
  entrypoint: "verifier/verify.py"
  hidden_boundary: true
  protected: true
anti_cheat:
  required: true
  oracle_verifier_separation: true
  trajectory_audit: true
