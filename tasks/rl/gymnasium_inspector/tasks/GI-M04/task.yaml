name: Gymnasium termination and truncation contract

objective: Repair the environment termination and truncation semantics while preserving the public Gymnasium API.

agent_interface:
  type: external_agent
  protocol: gymnasium

environment:
  entrypoint: environment/data/gym_env.py
  class: GymInspectorEnv
  reset_seed: 123
  max_steps: 6

evaluation:
  deterministic: true
  oracle_required: true
