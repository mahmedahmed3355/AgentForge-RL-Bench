schema_version = "1.4"

[task]
id = "CUDA-H01"
name = "Multi-Stage GPU Pipeline Recovery & Optimization"
difficulty = "hard"
domain = "cuda"
family = "cuda_engineering"
authors = [
  { name = "AgentForge", email = "agentforge@example.com" }
]

[metadata]
capability = "long_horizon_gpu_engineering"
environment = "cuda_pipeline"
horizon = 100
oracle_required = true
verifier_required = true
hidden_evaluation = true
multi_reward = true

[reward]
components = ["progress", "correctness", "tests", "efficiency", "terminal", "penalties"]
aggregation = "RewardBreakdown.total"

[environment]
family = "cuda_pipeline"
stateful = true
partial_observability = true
deterministic_seed = true
checkpointable = true
execution_modes = ["real_cuda", "deterministic_simulation"]

[oracle]
enabled = true
source_of_truth = "reference_behavior"
modifies_candidate = false
writes_reference_artifacts = true

[verifier]
enabled = true
validates_final_state = true
validates_trajectory = true
validates_hidden_cases = true
rejects_reward_hacking = true

[termination]
success = "correctness_and_performance_verified"
failure = "invalid_terminal_state"
timeout = "max_steps"

